steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - docker/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/bxailab/sports-ai-backend/backend:v1

images:
  - ${_IMAGE}

options:
  logging: CLOUD_LOGGING_ONLY
